<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pararara</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pararara">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}body{box-sizing:border-box}iframe{display:block;width:100%;height:100%;border:0}
@media (display-mode: standalone){body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}}
body.dark{background:#1b1d21}</style>
</head>
<body>
<script>
(function () {
  var FALLBACK = "https://pararara.46-62-200-155.sslip.io/";
  var valid = function (b) { return /^https:\/\/[a-z0-9.-]+(:\d{1,5})?\/([\w.~-]+\/)*$/i.test(b) && b.length < 200; };
  var frame = null;
  function load() {
    return fetch("api-base.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .catch(function () { return ""; })
      .then(function (t) {
        var base = t.trim();
        if (!valid(base)) base = FALLBACK;
        var src = base + location.search + location.hash;
        if (!frame) {
          frame = document.createElement("iframe");
          frame.allow = "geolocation; fullscreen; web-share; clipboard-write";
          frame.title = "pararara";
          frame.src = src;
          document.body.appendChild(frame);
        } else if (frame.src.indexOf(base) !== 0) {
          frame.src = src;
        }
      });
  }
  var install = null;
  var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  function tell() {
    if (!frame) return;
    frame.contentWindow.postMessage({ pararara: "shell", standalone: standalone, installable: !!install }, new URL(frame.src).origin);
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    install = e;
    tell();
  });
  window.addEventListener("appinstalled", function () {
    install = null;
    tell();
  });
  window.addEventListener("message", function (e) {
    if (!frame || e.source !== frame.contentWindow || !e.data) return;
    var m = e.data.pararara;
    if (m === "api-base") load();
    else if (m === "hello") tell();
    else if (m === "theme") {
      document.body.classList.toggle("dark", !!e.data.dark);
      document.querySelector('meta[name="theme-color"]').content = e.data.dark ? "#1b1d21" : "#ffffff";
    } else if (m === "install" && install) {
      var prompt = install;
      install = null;
      prompt.prompt();
      prompt.userChoice.then(tell, tell);
    }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  load();
})();
</script>
<noscript><iframe src="https://pararara.46-62-200-155.sslip.io/" title="pararara"></iframe></noscript>
</body>
</html>
