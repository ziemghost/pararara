<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pararara</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
(function () {
  var FALLBACK = "https://pararara.46-62-200-155.sslip.io/";
  var valid = function (b) { return /^https:\/\/[a-z0-9.-]+(:\d{1,5})?\/([\w.~-]+\/)*$/i.test(b) && b.length < 200; };
  var frame = null;
  function load() {
    return fetch("api-base.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .catch(function () { return ""; })
      .then(function (t) {
        var base = t.trim();
        if (!valid(base)) base = FALLBACK;
        var src = base + location.search + location.hash;
        if (!frame) {
          frame = document.createElement("iframe");
          frame.allow = "geolocation; fullscreen; web-share; clipboard-write";
          frame.title = "pararara";
          frame.src = src;
          document.body.appendChild(frame);
        } else if (frame.src.indexOf(base) !== 0) {
          frame.src = src;
        }
      });
  }
  window.addEventListener("message", function (e) {
    if (frame && e.source === frame.contentWindow && e.data && e.data.pararara === "api-base") load();
  });
  load();
})();
</script>
<noscript><iframe src="https://pararara.46-62-200-155.sslip.io/" title="pararara"></iframe></noscript>
</body>
</html>
